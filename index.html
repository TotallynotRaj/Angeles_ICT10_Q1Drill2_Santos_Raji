<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arithmetic Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.6.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.6.1/core.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh; margin: 0; padding: 24px 12px;
            background: #e8f1f2; color: #243b45;
            font-family: "Trebuchet MS", Arial, sans-serif;
        }
        .container { padding: 0; }
        .calculator {
            max-width: 560px; margin: 30px auto; padding: 32px;
            background: #fff; border: 1px solid #d4e2e4;
            border-radius: 12px; box-shadow: 0 8px 20px #243b4520;
        }
        h1 { margin-bottom: 8px; color: #164e63; font-size: 2rem; }
        .text-muted { color: #607780 !important; }
        .form-label { color: #31545d; font-weight: 600; }
        .form-control {
            padding: 11px 12px; border: 1px solid #b8ced1; border-radius: 7px;
        }
        .form-control:focus {
            border-color: #247b82; box-shadow: 0 0 0 3px #247b8226;
        }
        .operations {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 10px; margin-top: 22px;
        }
        .btn {
            width: 100%; margin: 0; padding: 11px 8px;
            border: 0; border-radius: 7px; font-weight: 600;
            transition: transform .15s ease;
        }
        .btn-primary { background: #176b87; }
        .btn-success { background: #287a68; }
        .btn-warning { background: #c47a24; color: #fff; }
        .btn-danger { background: #b34d4d; }
        .btn-primary:hover, .btn-primary:focus, .btn-primary:active { background: #176b87 !important; }
        .btn-success:hover, .btn-success:focus, .btn-success:active { background: #287a68 !important; }
        .btn-warning:hover, .btn-warning:focus, .btn-warning:active {
            background: #c47a24 !important; color: #fff !important; box-shadow: none !important;
        }
        .btn-danger:hover, .btn-danger:focus, .btn-danger:active { background: #b34d4d !important; }
        .btn:hover { transform: scale(1.03); }
        #output {
            min-height: 54px; margin-top: 24px; padding: 15px;
            background: #f1f7f7; border: 1px solid #c5dadd; border-radius: 6px;
        }
        .result-title {
            margin-bottom: 5px; color: #247b82; font-size: .8rem;
            font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
        }
        .result-message { margin: 0; color: #243b45; font-size: 1.05rem; font-weight: 600; }
        .result-message.error { color: #a04444; }
        @media (max-width: 420px) {
            .calculator { margin: 10px auto; padding: 24px 18px; }
            h1 { font-size: 1.65rem; }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="calculator">

            <h1 class="text-center">Arithmetic Calculator</h1>

            <p class="text-center text-muted">
                Enter two numbers and choose an operation.
            </p>

            <div class="mb-3">
                <label for="num1" class="form-label">First Number</label>
                <input type="number" id="num1" class="form-control"
                       placeholder="Enter first number">
            </div>

            <div class="mb-3">
                <label for="num2" class="form-label">Second Number</label>
                <input type="number" id="num2" class="form-control"
                       placeholder="Enter second number">
            </div>

            <div class="operations">
                <button class="btn btn-primary" py-click="add">
                    Addition (+)
                </button>

                <button class="btn btn-success" py-click="subtract">
                    Subtraction (-)
                </button>

                <button class="btn btn-warning" py-click="multiply">
                    Multiplication (×)
                </button>

                <button class="btn btn-danger" py-click="divide">
                    Division (÷)
                </button>
            </div>

            <div id="output">
                <p class="text-muted">Results will appear here.</p>
            </div>

        </div>
    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
